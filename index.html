<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yessy – det är dags att laga</title>
  <meta name="theme-color" content="#f4f5f7">
  <script>
    /* Apply the theme before first paint: saved choice, else OS preference. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('jesse-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var d = document.documentElement;
      d.setAttribute('data-theme', t);
      d.style.colorScheme = t;
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111418');
    })();
  </script>
  <link rel="icon" href="favicon.ico?v=20261011g" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/brand/jesse-logo-light-512.png?v=20261011g" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/brand/jesse-logo-dark-512.png?v=20261011g" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png?v=20261011g">
  <link rel="stylesheet" href="css/style.css?v=20261021tm">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <a href="#browse" class="brand" aria-label="Yessy, till receptlistan">
      <img class="brand-mark brand-mark-light" src="assets/brand/jesse-logo-light.png?v=20261011g" width="36" height="36" alt="" decoding="async">
      <img class="brand-mark brand-mark-dark" src="assets/brand/jesse-logo-dark.png?v=20261011g" width="36" height="36" alt="" decoding="async">
      <span class="brand-text">
        <span class="brand-word">Yessy</span>
        <span class="brand-tagline">det är dags att laga</span>
      </span>
    </a>
    <div id="auth" class="auth">
      <button type="button" class="auth-btn header-icon-link" aria-haspopup="dialog" aria-expanded="false" aria-label="Logga in" title="Logga in"></button>
      <div class="auth-pop" role="dialog" aria-label="Konto" hidden></div>
    </div>
  </header>

  <main class="main-browse">
    <!-- Browse + shopping sidebar -->
    <div id="app-layout" class="app-layout is-browse">
      <section id="view-browse"></section>
      <aside id="shopping-sidebar" class="shopping-sidebar" aria-label="Inköpslista"></aside>
    </div>
    <div id="shopping-sidebar-backdrop" class="shopping-sidebar-backdrop" hidden></div>
    <button type="button" id="shopping-drawer-toggle" class="shopping-drawer-toggle" hidden>
      Inköpslista
    </button>

    <!-- Cooking / Matlagning (flow graph + steps) -->
    <section id="view-cooking" style="display:none">
      <div id="cooking-hero" hidden></div>
      <div id="cooking-header" hidden></div>
      <div id="cook-toggles" class="cook-toggles"></div>
      <div id="cook-graph" class="cook-graph"></div>
      <div id="cooking-layout" class="cooking-layout">
        <aside class="cooking-sidebar">
          <div id="cook-portions" class="cook-portions"></div>
          <div id="cook-spice-mixes" class="cook-spice-mixes"></div>
          <div id="cooking-ingredients"></div>
          <div id="cooking-nutrition" hidden></div>
        </aside>
        <div class="cooking-main">
          <div id="cooking-steps"></div>
        </div>
      </div>
    </section>

    <!-- Kryddskåpet (#kryddor): spice blend calculator -->
    <section id="view-spices" style="display:none"></section>

    <!-- Skafferiet (#skafferi): pantry staples -> recipes -->
    <section id="view-pantry" style="display:none"></section>

    <!-- Mitt konto (#konto) -->
    <section id="view-account" class="view-account" style="display:none"></section>
  </main>

  <script type="module" src="js/main.js?v=20261021tm"></script>
</body>
</html>
